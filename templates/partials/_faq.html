{% if site.faq %}
<section id="faq" class="max-w-3xl mx-auto px-4 sm:px-6 py-16 scroll-mt-20">
  <h2 class="text-2xl sm:text-3xl font-bold text-white mb-8">Частые вопросы</h2>
  <div class="space-y-3" data-faq-accordion>
    {% for item in site.faq %}
      <details class="group rounded-xl border border-slate-700 bg-cardbg px-4 py-3 open:border-blue-600/50">
        <summary class="flex items-center justify-between cursor-pointer text-white font-medium list-none">
          <span>{{ item.question }}</span>
          <span class="text-slate-400 group-open:rotate-45 transition shrink-0 ml-3">+</span>
        </summary>
        <p class="text-slate-400 text-sm mt-3 leading-relaxed">{{ item.answer }}</p>
      </details>
    {% endfor %}
  </div>
</section>
{% endif %}
